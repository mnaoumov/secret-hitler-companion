name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Only one deployment at a time, and never cancel one half-way: an interrupted Pages deploy can
# leave the live site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build:compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Spellcheck
        run: npm run spellcheck

      - name: Markdown lint
        run: npm run lint:md

      - name: Test
        run: npm run test

  # Publishes the static build to GitHub Pages, but only from main and only behind a green gate:
  # the site is read by a table mid-game, so a broken build must never reach it.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The built page references `app.js` and `styles.css` relatively, so it needs no base path and
      # works unchanged under the `/secret-hitler-companion/` prefix of a project page.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
