name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # A clean new run of `main` without inventing a commit, for when a deploy has to be redone.
  workflow_dispatch:

# Only one deployment at a time, and never cancel one half-way: an interrupted Pages deploy can
# leave the live site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit-message step below needs the commits of the pushed range, not only its tip.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `.husky/commit-msg` lints every local commit, but `--no-verify` skips it and a commit made in
      # another checkout never meets it — which is how the one message carrying a private backlog id
      # reached `main`. So the pushed range is linted again here. Only the NEW commits: the history
      # before this step existed holds that one message, and rewriting published history is a separate
      # decision from guarding against the next one. A push that creates a branch has no `before`.
      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            npx --no -- commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            npx --no -- commitlint --from "$PUSH_BEFORE" --to "$GITHUB_SHA" --verbose
          else
            echo 'No previous commit to compare against; nothing to lint.'
          fi

      - name: Type check
        run: npm run build:compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Spellcheck
        run: npm run spellcheck

      - name: Markdown lint
        run: npm run lint:md

      # The rule sources under `scripts/helpers/eslint-rules/` are hand-copies of `obsidian-dev-utils`'.
      # The pre-commit hook runs this too, but only when a copy is STAGED, so it can never notice upstream
      # moving underneath a tree nobody is editing — which is the drift direction that produced the gate.
      # `GITHUB_TOKEN` is the runner's own token: unauthenticated, GitHub's contents API allows 60 requests
      # an hour per address, which a shared runner can have spent before this step is reached.
      - name: Check vendored ESLint rules
        run: npm run check:vendored-eslint-rules
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The helpers under `scripts/helpers/` are peer copies of `typescript-template`'s. Same reasoning as
      # the step above: the pre-commit hook runs this too, but only when a copy is STAGED, so it can never
      # notice the peer moving underneath a file nobody is editing.
      - name: Check helpers sync
        run: npm run check:helpers-sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        run: npm run test

  # Publishes the static build to GitHub Pages, but only from main and only behind a green gate:
  # the site is read by a table mid-game, so a broken build must never reach it.
  deploy:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The built page references `app.js` and `styles.css` relatively, so it needs no base path and
      # works unchanged under the `/secret-hitler-companion/` prefix of a project page.
      #
      # The artifact is named per attempt. Artifacts belong to the RUN, not the attempt, and a re-run never
      # clears an earlier attempt's, so under the fixed default name `github-pages` every re-run of a failed
      # deploy added one more and `deploy-pages` refused them all ("Multiple artifacts named github-pages").
      # A transient deploy failure then could not be recovered by re-running it.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
